<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockchain Logistics Node</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d14;
      --surface: #141726;
      --surface-2: #1d2136;
      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.16);
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2a2f4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px;
    }
    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 0 0 14px; font-size: 16px; color: #c4b5fd; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
      border-radius: 999px; font-size: 13px; font-weight: 600;
    }
    .badge-ok { background: var(--emerald-soft); color: var(--emerald); border: 1px solid rgba(16,185,129,0.4); }
    .badge-err { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.4); }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 20px;
    }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .stat-box { background: var(--surface-2); border-radius: 10px; padding: 12px; border: 1px solid var(--border); }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-val { font-size: 18px; font-weight: 600; margin-top: 4px; word-break: break-all; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 9px 12px; font-family: inherit; font-size: 14px;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    .row > * { flex: 1; }
    button {
      background: var(--purple); color: #fff; border: none; border-radius: 8px;
      padding: 9px 14px; font-family: inherit; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: 0.9; }
    button.btn-emerald { background: var(--emerald); color: #042f2e; }
    button.btn-ghost { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
    .peer-item {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
      background: var(--surface-2); padding: 10px 12px; border-radius: 10px; margin-top: 8px;
      border: 1px solid var(--border);
    }
    .chain-list { display: grid; gap: 12px; }
    .block-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-left: 4px solid var(--purple); border-radius: 10px; padding: 14px 16px;
    }
    .block-card.genesis { border-left-color: var(--emerald); }
    .tx-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; margin-top: 8px;
    }
    .log-box {
      background: #07090f; border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; max-height: 170px; overflow-y: auto; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 id="node-title">Загрузка ноды...</h1>
        <div class="mono" style="color: var(--muted);" id="node-meta"></div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <span id="valid-badge" class="badge badge-ok">...</span>
        <button class="btn-ghost" onclick="refreshAll()">Обновить</button>
        <button class="btn-emerald" onclick="validateChain()">Проверить цепочку</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat-box"><div class="stat-label">Высота цепочки</div><div class="stat-val" id="stat-len">-</div></div>
      <div class="stat-box"><div class="stat-label">Известные пиры</div><div class="stat-val" id="stat-peers">-</div></div>
      <div class="stat-box"><div class="stat-label">Хеш генезиса</div><div class="stat-val mono" id="stat-genesis">-</div></div>
      <div class="stat-box"><div class="stat-label">Последний хеш</div><div class="stat-val mono" id="stat-last">-</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>Создать блок с транзакцией</h2>
        <div class="row">
          <div>
            <label>Тип события</label>
            <select id="tx-type">
              <option value="CREATE_SHIPMENT">CREATE_SHIPMENT</option>
              <option value="TRANSFER_SHIPMENT">TRANSFER_SHIPMENT</option>
            </select>
          </div>
          <div>
            <label>Номер груза</label>
            <input id="tx-shipment" value="SH-100" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>From User ID (пусто для CREATE)</label>
            <input id="tx-from" type="number" placeholder="null" />
          </div>
          <div>
            <label>To User ID</label>
            <input id="tx-to" type="number" value="1" />
          </div>
        </div>
        <label>Хеш документа (опционально)</label>
        <input id="tx-doc" placeholder="sha256..." />
        <div style="margin: 12px 0; display:flex; align-items:center; gap:8px;">
          <input id="tx-broadcast" type="checkbox" style="width:auto;" checked />
          <span style="font-size:13px;">Сразу разослать блок всем пирам (Push)</span>
        </div>
        <button class="btn-emerald" style="width:100%;" onclick="createBlock()">Добавить блок</button>
      </div>

      <div class="card">
        <h2>Сеть и взаимодействие с пирами</h2>
        <label>Адрес другой ноды</label>
        <div class="row">
          <input id="peer-url" placeholder="http://127.0.0.1:8002" />
          <button style="flex:0 0 auto;" onclick="registerPeer()">Подключить</button>
        </div>
        <div style="margin-top:8px; display:flex; align-items:center; gap:8px;">
          <input id="peer-bidir" type="checkbox" style="width:auto;" checked />
          <span style="font-size:13px;">Двусторонняя регистрация (handshake)</span>
        </div>
        <div id="peers-list" style="margin-top: 12px;"></div>
      </div>
    </div>

    <div class="card">
      <h2>Журнал операций и ответов сети</h2>
      <div id="log" class="log-box mono">Готово к работе.</div>
    </div>

    <div class="card">
      <h2>Цепочка блоков</h2>
      <div id="chain-list" class="chain-list"></div>
    </div>
  </div>

  <script>
    const shortHash = (h) => h ? `${h.slice(0, 12)}...${h.slice(-8)}` : '-';

    function logEvent(title, payload) {
      const box = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const text = typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2);
      box.textContent = `[${time}] ${title}\n${text}\n\n` + box.textContent;
    }

    async function api(path, options = {}) {
      const resp = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        throw new Error(data.detail ? JSON.stringify(data.detail) : `HTTP ${resp.status}`);
      }
      return data;
    }

    async function refreshAll() {
      try {
        const [info, blocks] = await Promise.all([api('/api/v1/node/info'), api('/api/v1/blocks')]);
        document.title = `Node: ${info.node_id}`;
        document.getElementById('node-title').textContent = `Нода: ${info.node_id}`;
        document.getElementById('node-meta').textContent = `${info.address}  |  Хранилище: ${info.storage_path}`;
        document.getElementById('stat-len').textContent = info.chain_length;
        document.getElementById('stat-peers').textContent = info.peers.length;
        document.getElementById('stat-genesis').textContent = shortHash(info.genesis_hash);
        document.getElementById('stat-last').textContent = shortHash(info.last_block_hash);

        const badge = document.getElementById('valid-badge');
        badge.className = info.is_valid ? 'badge badge-ok' : 'badge badge-err';
        badge.textContent = info.is_valid ? 'Цепочка валидна' : 'Ошибка целостности';

        renderPeers(info.peers);
        renderBlocks(blocks);
      } catch (err) {
        logEvent('Ошибка обновления', err.message);
      }
    }

    function renderPeers(peers) {
      const el = document.getElementById('peers-list');
      if (!peers.length) {
        el.innerHTML = '<div style="color:var(--muted); font-size:13px;">Пиры пока не подключены.</div>';
        return;
      }
      el.innerHTML = '';
      peers.forEach((url) => {
        const div = document.createElement('div');
        div.className = 'peer-item';
        div.innerHTML = `
          <span class="mono"></span>
          <div style="display:flex; gap:6px;">
            <button class="btn-ghost" data-act="inspect">Статус</button>
            <button class="btn-emerald" data-act="pull">Запросить блок (Pull)</button>
          </div>
        `;
        div.querySelector('span').textContent = url;
        div.querySelector('[data-act="inspect"]').onclick = () => inspectPeer(url);
        div.querySelector('[data-act="pull"]').onclick = () => pullNextBlock(url);
        el.appendChild(div);
      });
    }

    function renderBlocks(blocks) {
      const el = document.getElementById('chain-list');
      el.innerHTML = '';
      [...blocks].reverse().forEach((b) => {
        const card = document.createElement('div');
        card.className = 'block-card' + (b.index === 0 ? ' genesis' : '');
        const txHtml = b.transactions.length
          ? b.transactions.map((tx) => `
              <div class="tx-box mono">
                ${tx.event_type} | ${tx.shipment_number} | ${tx.from_user_id ?? 'null'} -> ${tx.to_user_id ?? 'null'}<br/>
                tx_hash: ${shortHash(tx.hash)} ${tx.document_hash ? '| doc: ' + shortHash(tx.document_hash) : ''}
              </div>
            `).join('')
          : '<div style="color:var(--muted); font-size:13px; margin-top:6px;">Генезис-блок (без транзакций)</div>';

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <strong>Блок #${b.index}</strong>
            <div style="display:flex; gap:8px; align-items:center;">
              <span class="mono" style="color:var(--muted);">${b.timestamp}</span>
              ${b.index > 0 ? `<button class="btn-ghost" data-push="${b.index}">Отправить пирам</button>` : ''}
            </div>
          </div>
          <div class="mono" style="margin-top:6px; color:#a7f3d0;">hash: ${b.hash}</div>
          <div class="mono" style="color:var(--muted);">prev: ${b.prev_hash}</div>
          ${txHtml}
        `;
        const pushBtn = card.querySelector('[data-push]');
        if (pushBtn) pushBtn.onclick = () => broadcastBlock(b.index);
        el.appendChild(card);
      });
    }

    async function createBlock() {
      const fromVal = document.getElementById('tx-from').value;
      const toVal = document.getElementById('tx-to').value;
      const docVal = document.getElementById('tx-doc').value.trim();
      const body = {
        transactions: [{
          event_type: document.getElementById('tx-type').value,
          shipment_number: document.getElementById('tx-shipment').value.trim(),
          from_user_id: fromVal === '' ? null : Number(fromVal),
          to_user_id: toVal === '' ? null : Number(toVal),
          document_hash: docVal || null,
        }],
        broadcast: document.getElementById('tx-broadcast').checked,
      };
      try {
        const res = await api('/api/v1/blocks', { method: 'POST', body: JSON.stringify(body) });
        logEvent(`Создан Блок #${res.block.index}`, res);
        await refreshAll();
      } catch (err) {
        logEvent('Ошибка создания блока', err.message);
      }
    }

    async function registerPeer() {
      const url = document.getElementById('peer-url').value.trim();
      const bidirectional = document.getElementById('peer-bidir').checked;
      try {
        const res = await api('/api/v1/peers/register', {
          method: 'POST',
          body: JSON.stringify({ url, verify_connection: true, bidirectional }),
        });
        logEvent(`Пир подключён: ${url}`, res);
        document.getElementById('peer-url').value = '';
        await refreshAll();
      } catch (err) {
        logEvent(`Ошибка подключения к ${url}`, err.message);
      }
    }

    async function inspectPeer(url) {
      try {
        const res = await api(`/api/v1/peers/inspect?peer_url=${encodeURIComponent(url)}`);
        logEvent(`Статус пира ${url}`, res);
      } catch (err) {
        logEvent(`Ошибка опроса ${url}`, err.message);
      }
    }

    async function broadcastBlock(index) {
      try {
        const res = await api(`/api/v1/blocks/${index}/broadcast`, {
          method: 'POST',
          body: JSON.stringify({}),
        });
        logEvent(`Рассылка Блока #${index} (Push)`, res);
      } catch (err) {
        logEvent(`Ошибка рассылки Блока #${index}`, err.message);
      }
    }

    async function pullNextBlock(url) {
      try {
        const res = await api('/api/v1/blocks/fetch', {
          method: 'POST',
          body: JSON.stringify({ peer_url: url }),
        });
        logEvent(`Получен блок от ${url} (Pull)`, res);
        await refreshAll();
      } catch (err) {
        logEvent(`Ошибка получения блока от ${url}`, err.message);
      }
    }

    async function validateChain() {
      try {
        const res = await api('/api/v1/chain/validate');
        logEvent('Проверка локальной цепочки', res);
        await refreshAll();
      } catch (err) {
        logEvent('Ошибка проверки', err.message);
      }
    }

    refreshAll();
  </script>
</body>
</html>
